<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxelio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0A0A1E;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }
    #game-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #0A0A1E;
      display: none;
    }
    #exit-button {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 100;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    #exit-button:hover { opacity: 1; }
    #confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    #confirm-overlay.visible { display: flex; }
    .confirm-card {
      background: linear-gradient(160deg, #1A1A2E 0%, #0F0F22 50%, #0A0A1E 100%);
      border: 2px solid rgba(139, 95, 255, 0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(139,95,255,0.2);
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 400px;
      text-align: center;
    }
    .confirm-card h2 { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
    .confirm-card p { font-size: 14px; color: rgba(255,255,255,0.65); margin-bottom: 24px; line-height: 1.5; }
    .confirm-buttons { display: flex; gap: 8px; justify-content: center; }
    .btn {
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      border: none;
    }
    .btn-exit {
      background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%);
      color: white;
      border: 2px solid #991B1B;
      box-shadow: 0 4px 12px rgba(239,68,68,0.4);
    }
    .btn-cancel {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.15);
    }
    #status-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }
    #status-screen.hidden { display: none; }
    #status-icon { font-size: 72px; }
    #status-title { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; }
    #status-sub { font-size: 14px; color: rgba(255,255,255,0.6); max-width: 400px; line-height: 1.5; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #8B5FFF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <iframe id="game-frame" allow="fullscreen" allowfullscreen></iframe>

  <button id="exit-button">
    <span style="font-size: 14px;">✕</span>
    <span>Exit</span>
  </button>

  <div id="confirm-overlay">
    <div class="confirm-card">
      <h2>Leave the game?</h2>
      <p>You&apos;ll be returned to the Voxelio website.</p>
      <div class="confirm-buttons">
        <button class="btn btn-exit" id="confirm-yes">Exit</button>
        <button class="btn btn-cancel" id="confirm-no">Cancel</button>
      </div>
    </div>
  </div>

  <div id="status-screen">
    <div id="status-icon">🎮</div>
    <div id="status-title">VOXELIO</div>
    <div id="status-sub">Waiting for a game to launch…</div>
    <div id="status-spinner" class="spinner" style="display: none;"></div>
  </div>

  <!-- ===== UPDATE TOAST ===== -->
  <div id="update-toast" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 150;
    background: linear-gradient(135deg, rgba(20,10,40,0.95), rgba(10,5,30,0.95));
    border: 1px solid rgba(139, 95, 255, 0.5);
    border-radius: 12px;
    padding: 14px 18px;
    max-width: 320px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 30px rgba(139,95,255,0.2);
    display: none;
    font-size: 13px;
    font-family: system-ui, -apple-system, sans-serif;
  ">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
      <span style="font-size: 20px;">⬇️</span>
      <strong style="font-size: 14px;">Update Available</strong>
    </div>
    <div id="update-msg" style="color: rgba(255,255,255,0.75); line-height: 1.4;">
      Downloading…
    </div>
    <div id="update-progress-bar" style="
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      margin-top: 12px;
      overflow: hidden;
    ">
      <div id="update-progress-fill" style="
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #8B5FFF, #00E5FF);
        transition: width 0.3s ease;
      "></div>
    </div>
    <button id="update-restart" style="
      display: none;
      margin-top: 12px;
      width: 100%;
      background: linear-gradient(180deg, #22C55E, #16A34A);
      border: 2px solid #15803D;
      color: white;
      font-weight: 900;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    ">Restart to Update</button>
  </div>

  <script>
    const gameFrame = document.getElementById("game-frame");
    const exitButton = document.getElementById("exit-button");
    const confirmOverlay = document.getElementById("confirm-overlay");
    const confirmYes = document.getElementById("confirm-yes");
    const confirmNo = document.getElementById("confirm-no");
    const statusScreen = document.getElementById("status-screen");
    const statusIcon = document.getElementById("status-icon");
    const statusTitle = document.getElementById("status-title");
    const statusSub = document.getElementById("status-sub");
    const statusSpinner = document.getElementById("status-spinner");

    const updateToast = document.getElementById("update-toast");
    const updateMsg = document.getElementById("update-msg");
    const updateProgressBar = document.getElementById("update-progress-bar");
    const updateProgressFill = document.getElementById("update-progress-fill");
    const updateRestart = document.getElementById("update-restart");

    let gameLoaded = false;

    function setStatus({ icon, title, sub, spinner }) {
      statusScreen.classList.remove("hidden");
      if (icon !== undefined) statusIcon.textContent = icon;
      if (title !== undefined) statusTitle.textContent = title;
      if (sub !== undefined) statusSub.textContent = sub;
      if (spinner !== undefined) statusSpinner.style.display = spinner ? "block" : "none";
    }

    function showGame(url) {
      gameLoaded = true;
      gameFrame.src = url;
      gameFrame.style.display = "block";
      statusScreen.classList.add("hidden");
      exitButton.style.display = "flex";
    }

    function showError(message) {
      setStatus({
        icon: "⚠️",
        title: "Launch Failed",
        sub: message,
        spinner: false,
      });
      exitButton.style.display = "none";
    }

    // ===== Game loading =====
    window.voxelio.onLoadUrl(({ url }) => {
      setStatus({
        icon: "🌍",
        title: "Loading Game",
        sub: "Preparing the world…",
        spinner: true,
      });
      showGame(url);
    });

    window.voxelio.onLoadError(({ error }) => {
      showError(error);
    });

    // ===== Update UI =====
    window.voxelio.onUpdateAvailable(({ version }) => {
      updateToast.style.display = "block";
      updateMsg.textContent = `Downloading version ${version}…`;
    });

    window.voxelio.onUpdateProgress(({ percent }) => {
      updateToast.style.display = "block";
      updateMsg.textContent = `Downloading update… ${Math.round(percent)}%`;
      updateProgressFill.style.width = `${percent}%`;
    });

    window.voxelio.onUpdateDownloaded(({ version }) => {
      updateToast.style.display = "block";
      updateMsg.textContent = `Version ${version} is ready to install.`;
      updateProgressBar.style.display = "none";
      updateRestart.style.display = "block";
    });

    updateRestart.addEventListener("click", () => {
      window.voxelio.installUpdate();
    });

    // ===== Exit handling =====
    function showConfirm() { confirmOverlay.classList.add("visible"); }
    function hideConfirm() { confirmOverlay.classList.remove("visible"); }

    exitButton.addEventListener("click", showConfirm);
    confirmYes.addEventListener("click", () => window.voxelio.closeApp());
    confirmNo.addEventListener("click", hideConfirm);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (confirmOverlay.classList.contains("visible")) {
          hideConfirm();
        } else if (gameLoaded) {
          showConfirm();
        }
      }
    });
  </script>
</body>
</html>
